name: Supabase keep-alive

# Supabase Free pauses projects after 1 week of inactivity. Daily use prevents it; this is
# insurance for quiet weeks. Note: GitHub disables scheduled workflows in repos with no
# commits for 60 days - push something now and then.
#
# Required repository secrets: SUPABASE_URL, SUPABASE_ANON_KEY

on:
  schedule:
    - cron: '43 6 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping auth health and a trivial REST query
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --fail --silent --show-error "$SUPABASE_URL/auth/v1/health" -H "apikey: $SUPABASE_ANON_KEY"
          curl --silent --show-error -o /dev/null -w "REST status: %{http_code}\n" \
            "$SUPABASE_URL/rest/v1/app_settings?select=key&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY"
