# Supabase CLI configuration for cal-track.
#
# Production runs on a HOSTED Supabase project (free tier); this file mainly
# matters for `supabase link` / `supabase db push` and for anyone who runs the
# local stack with Docker. Hosted-only auth settings (invite-only, redirect URLs,
# SMTP, ...) are applied to the remote project with `supabase config push` or in
# the dashboard (Authentication > Providers / URL Configuration).
#
# Reference: https://supabase.com/docs/guides/local-development/cli/config

project_id = "cal-track"

[api]
enabled = true
port = 54321
# Only `public` is exposed. The `private` schema (internal SECURITY DEFINER
# helpers, see migration 20261110000008) must NEVER be listed here.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Keep in sync with the hosted project's Postgres major version.
major_version = 17

[db.migrations]
enabled = true

[db.seed]
# Seeds (nutrients, DRIs, exercise activities, ...) are generated by
# packages/core into supabase/seed/*.sql and applied by `supabase db reset`
# locally. They are NOT applied by `supabase db push`; see supabase/README.md.
enabled = true
sql_paths = ["./seed/*.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Local mail catcher: invite / recovery e-mails of the local stack land here.
[inbucket]
enabled = true
port = 54324

[storage]
# No file storage is used (no meal photos are stored).
enabled = false

[edge_runtime]
enabled = true
policy = "oneshot"

[analytics]
enabled = false

[auth]
enabled = true
# PLACEHOLDER: set to the real web origin of the app (also add native deep links
# under additional_redirect_urls). For the hosted project set it in the dashboard
# or with `supabase config push`.
site_url = "http://127.0.0.1:8081"
additional_redirect_urls = ["http://127.0.0.1:8081", "http://localhost:8081", "caltrack://auth-callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# INVITE-ONLY: public self-signup is disabled. The admin invites users from the
# dashboard (Authentication > Users > Invite user) or via the admin API.
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
# E-mail + password sign-in is enabled (the provider switch). Self-signup stays
# off through [auth].enable_signup above; invited users set their password from
# the invite link.
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600
