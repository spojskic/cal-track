# Supabase CLI configuration for ration.
#
# Production runs on a HOSTED Supabase project (free tier); this file mainly
# matters for `supabase link` / `supabase db push` and for anyone who runs the
# local stack with Docker. Hosted-only auth settings (invite-only, redirect URLs,
# SMTP, ...) are applied to the remote project with `supabase config push` or in
# the dashboard (Authentication > Providers / URL Configuration).
#
# Reference: https://supabase.com/docs/guides/local-development/cli/config

project_id = "ration"

[api]
enabled = true
port = 54321
# Only `public` is exposed. The `private` schema (internal SECURITY DEFINER
# helpers, see migration 20261110000008) must NEVER be listed here.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Keep in sync with the hosted project's Postgres major version.
major_version = 17

[db.migrations]
enabled = true

[db.seed]
# Seeds (nutrients, DRIs, exercise activities, ...) are generated by
# packages/core into supabase/seed/*.sql and applied by `supabase db reset`
# locally. They are NOT applied by `supabase db push`; see supabase/README.md.
enabled = true
sql_paths = ["./seed/*.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Local mail catcher: invite / recovery e-mails of the local stack land here.
# (Named [inbucket] in older Supabase CLI versions; the current CLI rejects that name.)
[local_smtp]
enabled = true
port = 54324

[storage]
# No file storage is used (no meal photos are stored).
enabled = false

[edge_runtime]
enabled = true
policy = "oneshot"

[analytics]
enabled = false

[auth]
enabled = true
# PLACEHOLDER: set to the real web origin of the app (also add native deep links
# under additional_redirect_urls). For the hosted project set it in the dashboard
# or with `supabase config push`.
site_url = "http://127.0.0.1:8081"
additional_redirect_urls = ["http://127.0.0.1:8081", "http://localhost:8081", "ration://auth-callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# INVITE-ONLY: public self-signup is disabled. The admin invites users from the
# dashboard (Authentication > Users > Invite user) or via the admin API.
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
# E-mail + password sign-in is enabled (the provider switch). Self-signup stays
# off through [auth].enable_signup above; the owner creates users in the dashboard
# (Authentication > Users > Add user, with Auto Confirm User).
enabled = true
double_confirm_changes = true
enable_confirmations = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

# Edge Functions (supabase/functions/*). Both need a signed-in user: the gateway
# verifies the JWT (verify_jwt) and the functions additionally refuse the anon key.
# Secrets are NOT stored here: `npx supabase secrets set FDC_API_KEY=... OFF_USER_AGENT=...`
# (see supabase/functions/README.md).
[functions.barcode-lookup]
enabled = true
verify_jwt = true

[functions.online-search]
enabled = true
verify_jwt = true

# Invite-code registration (docs/getting-started.md section 5). The caller has no account yet, so there is no user JWT to
# verify: verify_jwt = false. The gate is the invite code (consumed atomically in Postgres) plus per-client and global rate
# limits that run BEFORE the code table is touched. [auth] enable_signup stays false on purpose: the function creates the
# account with the admin API (service role, e-mail pre-confirmed), so no dashboard setting changes and no e-mail is sent.
# No secrets of its own (SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY are injected). Deploy: npx supabase functions deploy sign-up --use-api
[functions.sign-up]
enabled = true
verify_jwt = false

# The Invite people screen for the super admin: creates the code AND sends it by e-mail through Resend
# (secrets: RESEND_API_KEY, plus the optional RESEND_BASE_URL / APP_URL / DRY_RUN_EMAIL; see
# supabase/functions/README.md). verify_jwt = true: the caller is read from the verified JWT claims.
# Deploy: npx supabase functions deploy send-invite --use-api
[functions.send-invite]
enabled = true
verify_jwt = true

# The Friends screen: creates the request through send_friend_request_internal (migration 110) and, only when a
# request was actually created, e-mails the addressee through Resend (same secrets as send-invite).
# Deploy: npx supabase functions deploy friend-request --use-api
[functions.friend-request]
enabled = true
verify_jwt = true
